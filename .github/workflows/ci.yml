on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  run-tests:
    name: Run All Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install pyserial pillow coverage

      - name: Run run_tests.py
        working-directory: client
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/client
          xvfb-run -a python run_tests.py | tee test_summary.txt

      - name: Run test.py
        working-directory: client
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/client
          xvfb-run -a python -m unittest test.py | tee test_results.txt

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: test-artifacts
          path: |
            client/test_summary.txt
            client/test_results.txt

  arduino:
    name: Build Arduino Uno(server)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: '0.19.2'

      - name: Install Arduino AVR platform
        run: arduino-cli core install arduino:avr

      - name: Build Arduino Project
        run: arduino-cli compile --fqbn arduino:avr:uno server/server.ino

      - name: Upload Arduino Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: arduino-build
          path: server/build/*

  build-docs:
    name: Build Doxygen documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate Doxygen documentation
        run: |
          cd ./client
          doxygen Doxyfile

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v3
        with:
          name: Client_Documentation
          path: ./client/docs/
